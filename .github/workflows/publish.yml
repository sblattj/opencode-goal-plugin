name: Publish

# Manual only. This fork is not published to npm: the package is
# @sblattj/opencode-goal-plugin, which has no npm package and no Trusted
# Publisher, so a push-triggered run could only ever fail. Typecheck, lint and
# unit tests still run on every push via ci.yml. Re-add the push trigger if the
# scope is ever claimed on npm.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - unit-tests
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ci:version
      - name: Read publish name and version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
      - run: bun run build
      - run: npm publish --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PKG_NAME: ${{ steps.version.outputs.name }}
        run: |
          cat > release-notes.md <<EOF
          Published npm version: ${PKG_NAME}@${VERSION}

          Validation:
          - Typecheck passed.
          - Lint passed.
          - Unit tests passed.
          - Package published to npm.
          EOF

          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
